<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Noughts & Crosses | IS3S664</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="mosaic-mode">
    <!-- This game has been implemented from scratch -->
    <div class="game-container">
        <header>
            <h1>Noughts & Crosses</h1>
            <p class="subtitle">USW Advanced Internet & Mobile Computing</p>
        </header>

        <!-- Control Panel / Enhancements -->
        <div class="controls">
            <div class="control-group">
                <label for="grid-size">Grid Size:</label>
                <select id="grid-size">
                    <option value="3">3 x 3 (Standard)</option>
                    <option value="4">4 x 4 (Advanced)</option>
                </select>
            </div>
            <button id="mosaic-toggle-btn" class="btn btn-secondary" type="button">Mosaic: On</button>
            <button id="reset-btn" class="btn" type="button">Restart Game</button>
        </div>

        <!-- Scoreboard (Persistent via localStorage) -->
        <div class="scoreboard">
            <div class="score-card">
                <span>Player X</span>
                <span id="score-x">0</span>
            </div>
            <div class="score-card">
                <span>Draws</span>
                <span id="score-draw">0</span>
            </div>
            <div class="score-card">
                <span>Player O</span>
                <span id="score-o">0</span>
            </div>
        </div>

        <!-- Game Status -->
        <div id="status" class="status">Player X's Turn</div>

        <!-- Dynamic Game Board -->
        <div id="board" class="board grid-3"></div>

        <!-- Reset Stats Option -->
        <button id="clear-stats-btn" class="btn-text" type="button">Reset Scoreboard</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
